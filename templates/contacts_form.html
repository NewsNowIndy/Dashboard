{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Contact' if contact else 'New Contact' }}</h2>
<form method="post" class="row g-3 mt-2">

  <div class="col-md-4">
    <label class="form-label">First Name</label>
    <input class="form-control" name="first_name" value="{{ contact.first_name if contact else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Last Name</label>
    <input class="form-control" name="last_name" value="{{ contact.last_name if contact else '' }}">
  </div>
  <div class="col-md-4">
    <label class="form-label">Entity (Org / Outlet)</label>
    <input class="form-control" name="entity" value="{{ contact.entity if contact else '' }}">
  </div>

  <div class="col-md-6">
    <label class="form-label">E-Mail</label>
    <input class="form-control" type="email" name="email" value="{{ contact.email if contact else '' }}">
  </div>
  <div class="col-md-6">
    <label class="form-label">Phone</label>
    <input class="form-control" name="phone" value="{{ contact.phone if contact else '' }}">
  </div>

  <div class="col-md-4">
    <label class="form-label">Type</label>
    <select class="form-select" name="kind">
      <option value=""  {{ 'selected' if contact and not contact.kind }}>—</option>
      <option value="Source"  {{ 'selected' if contact and contact.kind=='Source' }}>Source</option>
      <option value="Contact" {{ 'selected' if contact and contact.kind=='Contact' }}>Contact</option>
    </select>
  </div>

  <div class="col-md-8">
    <label class="form-label">Projects (optional)</label>
    {% set selected_ids = (contact.projects | map(attribute='id') | list) if contact else [] %}
    <select class="form-select" name="project_ids[]" multiple size="6">
      {% for p in projects %}
      <option value="{{ p.id }}" {% if p.id in selected_ids %}selected{% endif %}>
        {{ p.name }}
      </option>
      {% endfor %}
    </select>
    <div class="form-text">Hold Ctrl/Cmd to select multiple.</div>
  </div>

  <div class="col-12">
    <button class="btn btn-primary">{{ 'Save Changes' if contact else 'Create Contact' }}</button>
    <a class="btn btn-secondary ms-2" href="{{ url_for('contacts.index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
