{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width: 860px;">
  <h2>Compose Email</h2>
  <form method="post" enctype="multipart/form-data">
    <div class="mb-2"><small class="text-muted">From: {{ default_from }}</small></div>
    <div class="mb-2">
      <label class="form-label">To</label>
      <input name="to" class="form-control" value="{{ default_to or '' }}" placeholder="alice@example.com, bob@example.com">
    </div>
    <div class="mb-2">
      <label class="form-label">Subject</label>
      <input name="subject" class="form-control" value="{{ default_subject or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Body</label>
      <textarea name="body" rows="8" class="form-control">{{ default_body or '' }}</textarea>
    </div>
  
    <div class="mb-3">
      <label class="form-label">Attachments</label>
      <input type="file" name="attachments" multiple class="form-control">
    </div>
  
    <div class="d-flex justify-content-between">
      <div class="form-check">
        <input class="form-check-input" type="radio" name="mode" id="mSmtp" value="smtp" {{ 'checked' if default_mode!='gmailapi' }}>
        <label class="form-check-label" for="mSmtp">Send via SMTP</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="radio" name="mode" id="mApi" value="gmailapi" {{ 'checked' if default_mode=='gmailapi' }}>
        <label class="form-check-label" for="mApi">Send via Gmail API</label>
      </div>
      <button class="btn btn-primary">Send</button>
    </div>
  </form>
</div>
{% endblock %}
